# eBPF 透明代理配置文件
# 此文件由 netproxy-native 读取并生成 sing-box 运行时入站配置
# 所有字段均可由高级用户直接调整；Android 管理器只展示常用项。

#######################################
# eBPF 基础设置
#######################################
# 数据路径: local=本机，shared=共享网络，hybrid=本机+共享网络
EBPF_MODE="local"
# 代理协议: 留空=TCP+UDP，或填写 tcp、udp、tcp,udp
EBPF_NETWORK=""
# UDP NAT 会话超时
EBPF_UDP_TIMEOUT="5m"
# DNS 处理模式: hijack=优先劫持，respect_bypass=遵循绕过，off=关闭劫持
EBPF_DNS_MODE="hijack"
# 绕过私网与特殊用途地址 (0=不在内核提前绕过，1=绕过)
EBPF_BYPASS_PRIVATE_ADDRESS=1
# 目的 IP 提前绕过规则集，多个规则集使用英文逗号分隔
EBPF_BYPASS_RULE_SET="direct,ChinaIP"

#######################################
# local 本机数据路径
#######################################
# 留空时由 sing-box 自动使用 cgroup v2 根目录
EBPF_LOCAL_CGROUP_PATH=""
# 本机 IPv6 接管策略: auto=有原生 IPv6 路由时接管，always=始终接管，off=关闭
EBPF_LOCAL_IPV6_MODE="auto"
# 直接指定需要代理的 UID，多个值使用英文逗号分隔
EBPF_LOCAL_INCLUDE_UID=""
# 需要代理的 UID 范围，格式为 start:end
EBPF_LOCAL_INCLUDE_UID_RANGE=""
# 直接指定需要绕过的 UID
EBPF_LOCAL_EXCLUDE_UID=""
# 需要绕过的 UID 范围，格式为 start:end
EBPF_LOCAL_EXCLUDE_UID_RANGE=""
# 需要代理的 Android 用户 ID
EBPF_LOCAL_INCLUDE_ANDROID_USER=""
# 高级用户直接填写包名，启动时由 sing-box 解析 UID
EBPF_LOCAL_INCLUDE_PACKAGE=""
EBPF_LOCAL_EXCLUDE_PACKAGE=""
# 本机重定向、UDP flow 和 socket-cookie 状态容量，0=使用 sing-box 默认值
EBPF_LOCAL_STATE_CAPACITY=0

#######################################
# 分应用代理
#######################################
# 启用分应用代理 (0=关闭，1=启用)
APP_PROXY_ENABLE=1
# blacklist=名单内绕过，whitelist=仅代理名单内应用
APP_PROXY_MODE="blacklist"
# 应用引用必须使用 <Android用户ID>:<包名>，多个引用使用英文逗号分隔
PROXY_APPS_LIST=""
BYPASS_APPS_LIST=""

#######################################
# shared 共享网络数据路径
#######################################
# 下游接口名称，英文逗号分隔；shared/hybrid 模式必须填写
EBPF_SHARED_INTERFACES="wlan2"
# 共享网络 IPv6 策略: always=接管，off=关闭
EBPF_SHARED_IPV6_MODE="always"
# 允许进入共享代理路径的来源 CIDR，英文逗号分隔；留空表示不限制
EBPF_SHARED_INCLUDE_SOURCE_CIDR=""
# 绕过共享代理路径的来源 CIDR，排除规则优先
EBPF_SHARED_EXCLUDE_SOURCE_CIDR=""
# 允许进入共享代理路径的来源 MAC 地址，英文逗号分隔；留空表示不限制
EBPF_SHARED_INCLUDE_MAC_ADDRESS=""
# 绕过共享代理路径的来源 MAC 地址，排除规则优先
EBPF_SHARED_EXCLUDE_MAC_ADDRESS=""
# shared proxy、bypass 和分片状态容量，0=使用 sing-box 默认值
EBPF_SHARED_STATE_CAPACITY=0
# TC filter 优先级，范围 1 到 65535
EBPF_SHARED_TC_PRIORITY=1
