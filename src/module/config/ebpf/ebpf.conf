# eBPF 透明代理配置文件
# 此文件由 netproxy-native 读取并生成 sing-box 运行时入站配置

#######################################
# 基础设置
#######################################
# 代理协议: 留空=TCP+UDP，tcp=仅 TCP，udp=仅 UDP
EBPF_NETWORK=""
# UDP NAT 会话超时
EBPF_UDP_TIMEOUT="5m"
# DNS 处理模式: hijack=劫持，off=放行
EBPF_DNS_MODE="hijack"
# 启用本机 cgroup 透明代理 (0=禁用，1=启用)
EBPF_CGROUP_ENABLED=1
# cgroup v2 路径，留空时由 sing-box 自动发现
EBPF_CGROUP_PATH=""
# IPv6 接管策略: disabled=关闭，auto=自动判断，always=始终接管，shared=仅共享网络
EBPF_IPV6_MODE="auto"

#######################################
# 规则集提前绕过
#######################################
# 仅支持可提取纯 IP CIDR 的规则集，命中后不会进入 sing-box 路由
EBPF_BYPASS_RULE_SETS="direct ChinaIP"

#######################################
# 分应用代理
#######################################
# 启用分应用代理 (0=代理全部应用，1=按名单过滤)
APP_PROXY_ENABLE=1
# 应用模式: blacklist=名单内绕过，whitelist=仅代理名单内应用
APP_PROXY_MODE="blacklist"
# 生效的 Android 用户 ID，空格分隔；留空表示全部用户
APP_ANDROID_USERS=""
# 代理应用包名，空格分隔
PROXY_APPS_LIST=""
# 绕过应用包名，空格分隔
BYPASS_APPS_LIST=""

#######################################
# 热点与共享网络
#######################################
# 启用热点或 USB 共享代理 (0=禁用，1=启用)
EBPF_SHARED_NETWORK=0
# 下游接口名称，空格分隔；必须填写实际进入 TC ingress 的接口
EBPF_SHARED_INTERFACES="wlan2"
# 允许进入共享代理路径的来源 CIDR，空格分隔；留空表示不限制
EBPF_SHARED_INCLUDE_SOURCE_CIDRS=""
# 绕过共享代理路径的来源 CIDR，空格分隔；排除规则优先
EBPF_SHARED_EXCLUDE_SOURCE_CIDRS=""
# 允许进入共享代理路径的来源 MAC 地址，空格分隔；留空表示不限制
EBPF_SHARED_INCLUDE_MAC_ADDRESSES=""
# 绕过共享代理路径的来源 MAC 地址，空格分隔；排除规则优先
EBPF_SHARED_EXCLUDE_MAC_ADDRESSES=""
#######################################
# eBPF Map 容量
#######################################
EBPF_TCP_MAP_CAPACITY=65536
EBPF_UDP_MAP_CAPACITY=65536
EBPF_SOCKET_MAP_CAPACITY=65536
EBPF_SHARED_MAP_CAPACITY=65536
