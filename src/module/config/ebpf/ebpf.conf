# eBPF 透明代理配置文件
# 此文件由 netproxyctl 内部运行时读取并生成 sing-box 入站配置
# 所有字段均可由高级用户直接调整；Android 管理器只展示常用项。

#######################################
# eBPF 基础设置
#######################################
# 代理协议: 留空=TCP+UDP，或填写 tcp、udp、tcp,udp
EBPF_NETWORK=""
# UDP NAT 会话超时
EBPF_UDP_TIMEOUT="5m"
# TC filter 优先级，范围 1 到 65535；通常保持默认值
EBPF_TC_PRIORITY=1
# 目的 IP 提前绕过规则集，多个规则集使用英文逗号分隔
EBPF_BYPASS_RULE_SET="geoip/cn"

#######################################
# local 本机数据路径
#######################################
# 启用本机应用流量接管 (0=关闭，1=开启)
EBPF_LOCAL_ENABLED=1
# 本机数据平面: cgroup=直接接管 socket，tc=跟随默认网络接口
EBPF_LOCAL_DATA_PLANE="cgroup"
# 可选的 cgroup v2 绝对路径；留空时接管当前可见的完整层级
EBPF_LOCAL_CGROUP_PATH=""
# 本机 DNS 处理模式: hijack=劫持全部可见 DNS，respect_policy=仅劫持筛选范围内 DNS，off=关闭劫持
EBPF_LOCAL_DNS_MODE="hijack"
# 本机 IPv6 接管 (0=关闭，1=开启)
EBPF_LOCAL_IPV6=1
# 本机流量绕过私网与特殊用途地址 (0=不在内核提前绕过，1=绕过)
EBPF_LOCAL_BYPASS_PRIVATE_ADDRESS=1
# 直接指定需要代理的 UID，多个值使用英文逗号分隔
EBPF_LOCAL_INCLUDE_UID=""
# 需要代理的 UID 范围，格式为 start:end
EBPF_LOCAL_INCLUDE_UID_RANGE=""
# 直接指定需要绕过的 UID
EBPF_LOCAL_EXCLUDE_UID=""
# 需要绕过的 UID 范围，格式为 start:end
EBPF_LOCAL_EXCLUDE_UID_RANGE=""
# 需要代理的 Android 用户 ID
EBPF_LOCAL_INCLUDE_ANDROID_USER=""
# 高级用户直接填写包名，启动时由 sing-box 解析 UID
EBPF_LOCAL_INCLUDE_PACKAGE=""
EBPF_LOCAL_EXCLUDE_PACKAGE=""
# 绕过接管的目标端口，多个端口使用英文逗号分隔
EBPF_LOCAL_BYPASS_PORT=""
# 绕过接管的目标端口范围，格式 start:end，多个范围使用英文逗号分隔
EBPF_LOCAL_BYPASS_PORT_RANGE=""

#######################################
# 分应用代理
#######################################
# 启用分应用代理 (0=关闭，1=启用)
APP_PROXY_ENABLE=1
# blacklist=名单内绕过，whitelist=仅代理名单内应用
APP_PROXY_MODE="blacklist"
# 应用引用必须使用 <Android用户ID>:<包名>，多个引用使用英文逗号分隔
PROXY_APPS_LIST=""
BYPASS_APPS_LIST=""

#######################################
# shared 共享网络数据路径
#######################################
# 启用热点与共享网络流量接管 (0=关闭，1=开启)
EBPF_SHARED_ENABLED=0
# 共享数据平面: packet_rewrite=以太网热点，socket_assign=raw-IP、PPP 或隧道接口
EBPF_SHARED_DATA_PLANE="packet_rewrite"
# 共享网络 DNS 处理模式: hijack=劫持全部可见 DNS，respect_policy=仅劫持筛选范围内 DNS，off=关闭劫持
EBPF_SHARED_DNS_MODE="hijack"
# 下游接口名称，英文逗号分隔；启用共享网络时必须填写
EBPF_SHARED_INTERFACES="wlan2"
# 共享网络 IPv6 接管 (0=关闭，1=开启)
EBPF_SHARED_IPV6=1
# 共享网络流量绕过私网与特殊用途地址 (0=不在内核提前绕过，1=绕过)
EBPF_SHARED_BYPASS_PRIVATE_ADDRESS=1
# 允许进入共享代理路径的来源 CIDR，英文逗号分隔；留空表示不限制
EBPF_SHARED_INCLUDE_SOURCE_CIDR=""
# 绕过共享代理路径的来源 CIDR，排除规则优先
EBPF_SHARED_EXCLUDE_SOURCE_CIDR=""
# 允许进入共享代理路径的来源 MAC 地址，英文逗号分隔；留空表示不限制
EBPF_SHARED_INCLUDE_MAC_ADDRESS=""
# 绕过共享代理路径的来源 MAC 地址，排除规则优先
EBPF_SHARED_EXCLUDE_MAC_ADDRESS=""
# 绕过共享接管的目标端口，多个端口使用英文逗号分隔
EBPF_SHARED_BYPASS_PORT=""
# 绕过共享接管的目标端口范围，格式 start:end，多个范围使用英文逗号分隔
EBPF_SHARED_BYPASS_PORT_RANGE=""
