# eBPF 透明代理配置文件
# 此文件由 runtime.sh 读取并生成 sing-box 运行时入站配置

#######################################
# 基础设置
#######################################
# 代理协议: 留空=TCP+UDP，tcp=仅 TCP，udp=仅 UDP
EBPF_NETWORK=""
# UDP NAT 会话超时
EBPF_UDP_TIMEOUT="5m"
# DNS 处理模式: hijack=劫持，off=放行
EBPF_DNS_MODE="hijack"
# cgroup v2 路径，留空时由 sing-box 自动发现
EBPF_CGROUP_PATH=""
# IPv6 透明代理 (0=禁用，1=启用)
EBPF_IPV6=1

#######################################
# 规则集提前绕过
#######################################
# 仅支持可提取纯 IP CIDR 的规则集，命中后不会进入 sing-box 路由
EBPF_BYPASS_RULE_SETS="direct cn-ip"

#######################################
# 分应用代理
#######################################
# 启用分应用代理 (0=代理全部应用，1=按名单过滤)
APP_PROXY_ENABLE=1
# 应用模式: blacklist=名单内绕过，whitelist=仅代理名单内应用
APP_PROXY_MODE="blacklist"
# 代理应用列表，空格分隔，支持 user:package 格式
PROXY_APPS_LIST=""
# 绕过应用列表，空格分隔，支持 user:package 格式
BYPASS_APPS_LIST=""

#######################################
# 热点与共享网络
#######################################
# 启用热点或 USB 共享代理 (0=禁用，1=启用)
EBPF_SHARED_NETWORK=0
# 下游接口名称，空格分隔；必须填写实际进入 TC ingress 的接口
EBPF_SHARED_INTERFACES="wlan2"

#######################################
# eBPF Map 容量
#######################################
EBPF_TCP_MAP_CAPACITY=65536
EBPF_UDP_MAP_CAPACITY=65536
EBPF_SOCKET_MAP_CAPACITY=65536
EBPF_SHARED_MAP_CAPACITY=65536
