# NetProxy 模块设置
# 开机自动启动服务 (1=启用, 0=禁用)
AUTO_START=0
# 当前活动节点组
ACTIVE_GROUP_ID="default"
# 当前分组的手动节点 tag；留空使用该组 Auto 动态测速
SELECTED_NODE_TAG=""

#######################################
# Wi-Fi 网络匹配
#######################################
# Wi-Fi 自动切换 (1=启用, 0=禁用)
WIFI_AUTO_SWITCH=0
# blacklist=名单内直连，whitelist=仅名单内使用默认模式
WIFI_SSID_MODE="blacklist"
# Wi-Fi 名称，JSON 字符串数组，精确匹配
WIFI_SSID_BLACKLIST=[]
WIFI_SSID_WHITELIST=[]
# 非 Wi-Fi 网络是否使用默认模式 (0=Direct，1=默认模式)
PROXY_ON_NON_WIFI=1
