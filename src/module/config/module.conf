# NetProxy 模块设置
# 开机自动启动服务 (1=启用, 0=禁用)
AUTO_START=0
# 当前活动节点组
ACTIVE_GROUP_ID="default"
# 当前分组的手动节点 tag；留空使用该组 Auto 动态测速
SELECTED_NODE_TAG=""

#######################################
# WiFi 自动切换出站模式
#######################################
# 按当前连接的 WiFi SSID 在基础模式与 Direct 间自动切换
WIFI_AUTO_SWITCH=0
# blacklist=名单内使用 Direct，whitelist=仅名单内使用基础模式
WIFI_SSID_MODE="blacklist"
# SSID 名单，英文逗号分隔
WIFI_SSID_LIST=""
# 非 WiFi 网络是否使用基础模式 (0=Direct，1=基础模式)
PROXY_ON_CELLULAR=1
