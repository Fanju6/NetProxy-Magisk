name: 构建并打包模块
description: 构建 WebUI、写入 versionCode，并打出完整包与 Lite 包

# 被 ci.yml 与 release.yml 复用的共享打包逻辑（调用前需已 checkout，且 fetch-depth: 0 以便统计提交数）
outputs:
  version:
    description: 模块版本号（取自 module.prop 的 version=）
    value: ${{ steps.meta.outputs.version }}
  commit_count:
    description: 提交数，用作 versionCode
    value: ${{ steps.meta.outputs.commit_count }}
  full_name:
    description: 完整包文件名
    value: ${{ steps.meta.outputs.full_name }}
  lite_name:
    description: Lite 包文件名
    value: ${{ steps.meta.outputs.lite_name }}

runs:
  using: composite
  steps:
    - name: 配置 Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/native/netproxy/go.mod
        cache-dependency-path: src/native/netproxy/go.sum

    - name: 构建 NetProxy 原生组件
      shell: bash
      working-directory: src/native/netproxy
      run: |
        set -euo pipefail
        go test ./...

        version="$(sed -n 's/^version=//p' ../../module/module.prop | head -n 1)"
        commit="$(git -C ../../.. rev-parse --short HEAD)"
        output="../../module/bin/netproxy-native"

        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
          -trimpath \
          -buildvcs=false \
          -ldflags="-s -w -buildid= -X main.version=${version} -X main.commit=${commit}" \
          -o "$output" \
          ./cmd/netproxy-native

        test -s "$output"
        chmod 0755 "$output"
        file "$output" | grep -q 'ARM aarch64'
        go version -m "$output" | grep -q 'github.com/reF1nd/sing-box'

    - name: 配置 Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/webui/package-lock.json

    - name: 构建 WebUI（产物 → src/module/webroot/netproxy）
      shell: bash
      working-directory: src/webui
      run: |
        npm ci
        npm run build

    - name: 计算版本并写入 module.prop
      id: meta
      shell: bash
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        sed -i "s/^versionCode=.*/versionCode=$COMMIT_COUNT/" src/module/module.prop
        VERSION=$(grep '^version=' src/module/module.prop | cut -d= -f2)
        {
          echo "version=$VERSION"
          echo "commit_count=$COMMIT_COUNT"
          echo "full_name=NetProxy_${VERSION}_${COMMIT_COUNT}.zip"
          echo "lite_name=NetProxy_${VERSION}_${COMMIT_COUNT}_lite.zip"
        } >> "$GITHUB_OUTPUT"

    - name: 打包模块（完整 / Lite）
      shell: bash
      working-directory: src/module
      env:
        FULL_NAME: ${{ steps.meta.outputs.full_name }}
        LITE_NAME: ${{ steps.meta.outputs.lite_name }}
      run: |
        # 完整包（全部组件）
        7z a -tzip -mx=9 "../../$FULL_NAME" .
        # Lite 包（不内置 Android 管理器 APK，代理与管理能力保持完整）
        7z a -tzip -mx=9 "../../$LITE_NAME" . -x!"NetProxy.apk"
