name: 发布（Release）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 并行构建模块与管理器
    uses: ./.github/workflows/build-module.yml

  release:
    name: 汇合并发布 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT_COUNT: ${{ needs.build.outputs.commit_count }}
      STANDARD_NAME: ${{ needs.build.outputs.standard_name }}
      MANAGER_NAME: ${{ needs.build.outputs.manager_name }}
    steps:
      - name: 拉取发布脚本与更新日志
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs

      - name: 配置发布脚本 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载本次运行的标准模块包
        uses: actions/download-artifact@v8
        with:
          name: module-standard

      - name: 下载本次运行的管理器
        uses: actions/download-artifact@v8
        with:
          name: manager-apk
          path: manager

      - name: 复用标准包生成含管理器包
        run: sh .github/scripts/package-manager.sh "$STANDARD_NAME" manager/NetProxy.apk "$MANAGER_NAME"

      - name: 生成模块自更新清单
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg version "Module ${TAG}" \
            --argjson versionCode "${COMMIT_COUNT}" \
            --arg zipUrl "https://github.com/${REPO}/releases/download/${TAG}/${STANDARD_NAME}" \
            --arg changelog "https://raw.githubusercontent.com/${REPO}/refs/heads/main/docs/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json
          cat update.json

      - name: 提取当前版本更新日志
        run: |
          node .github/scripts/extract-release-notes.mjs \
            docs/changelog.md \
            "$VERSION" \
            "$RUNNER_TEMP/release-notes.md"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ env.STANDARD_NAME }}
            ${{ env.MANAGER_NAME }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布通知到 Telegram
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2343
          parse-mode: markdown
          message: |
            **新版本发布通知**

            版本: `${{ github.ref_name }}`

            [查看更新日志并下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            **直接下载:**
            [标准包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.STANDARD_NAME }})
            [含管理器包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.MANAGER_NAME }})

      - name: 触发同步到 KernelSU 仓库
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # release:published 由 GITHUB_TOKEN 创建，受防递归限制不会自动触发 sync 工作流；
        # 故在此显式 dispatch（workflow_dispatch 是该限制的官方例外，GITHUB_TOKEN 可触发）。
        run: gh workflow run sync-kernelsu.yml

  failure:
    name: 通知构建或发布失败
    needs: [build, release]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失败通知
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2275
          parse-mode: markdown
          message: |
            **发布工作流执行失败！**

            标签: `${{ github.ref_name }}`

            [点击查看构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
