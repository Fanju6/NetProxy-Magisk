name: 发布（Release）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: 构建并打包模块
        id: pack
        uses: ./.github/actions/build-module

      - name: 生成模块自更新清单
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT_COUNT: ${{ steps.pack.outputs.commit_count }}
          STANDARD_NAME: ${{ steps.pack.outputs.standard_name }}
        run: |
          jq -n \
            --arg version "Module ${TAG}" \
            --argjson versionCode "${COMMIT_COUNT}" \
            --arg zipUrl "https://github.com/${REPO}/releases/download/${TAG}/${STANDARD_NAME}" \
            --arg changelog "https://raw.githubusercontent.com/${REPO}/refs/heads/main/docs/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json
          cat update.json

      - name: 提取当前版本更新日志
        run: |
          node .github/scripts/extract-release-notes.mjs \
            docs/changelog.md \
            "${{ steps.pack.outputs.version }}" \
            "$RUNNER_TEMP/release-notes.md"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ steps.pack.outputs.standard_name }}
            ${{ steps.pack.outputs.manager_name }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布通知到 Telegram
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2343
          parse-mode: markdown
          message: |
            **新版本发布通知**

            版本: `${{ github.ref_name }}`

            [查看更新日志并下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            **直接下载:**
            [标准包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.standard_name }})
            [含管理器包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.manager_name }})

      - name: 触发同步到 KernelSU 仓库
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # release:published 由 GITHUB_TOKEN 创建，受防递归限制不会自动触发 sync 工作流；
        # 故在此显式 dispatch（workflow_dispatch 是该限制的官方例外，GITHUB_TOKEN 可触发）。
        run: gh workflow run sync-kernelsu.yml

      - name: 失败通知
        if: failure()
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2275
          parse-mode: markdown
          message: |
            **发布工作流执行失败！**

            标签: `${{ github.ref_name }}`

            [点击查看构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
