name: 每周更新资源、内核与依赖

# 每周检查内置上游资源、sing-box 内核、npm 依赖与 GitHub Actions，
# 有更新则汇总到一个 PR（人工 review 合并后由 ci.yml 重建打包）。
# 资源清单见 .github/resources.json，新增/调整资源只改清单、无需动本文件。

on:
  schedule:
    - cron: '0 16 * * 0'   # 每周一 00:00 北京时间（= 周日 16:00 UTC）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-resources
  cancel-in-progress: true

jobs:
  update:
    name: 检查并更新资源、内核与依赖
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 初始化更新报告
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/netproxy-update-report"
          rm -rf "$report_dir"
          mkdir -p "$report_dir"
          echo "UPDATE_REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      - name: 检查 sing-box 内核
        id: singbox_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$(jq -r '.singBox.repo' .github/resources.json)"
          pattern="$(jq -r '.singBox.tagPattern' .github/resources.json)"
          current="$(jq -r '.singBox.currentVersion' .github/resources.json)"
          target="$(jq -r '.singBox.path' .github/resources.json)"
          go_version="$(jq -r '.singBox.goVersion' .github/resources.json)"
          ndk_version="$(jq -r '.singBox.ndkVersion' .github/resources.json)"
          build_tags="$(jq -r '.singBox.buildTags | join(",")' .github/resources.json)"
          latest="$({
            gh api --paginate "repos/${repo}/tags?per_page=100" --jq '.[].name' |
              grep -E "$pattern" |
              sort -V |
              tail -n 1
          } || true)"

          if [ -z "$latest" ]; then
            echo "::error::未找到匹配的 reF1nd sing-box 版本标签"
            exit 1
          fi

          changed=false
          if [ "$latest" != "$current" ]; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "current_version=$current" >> "$GITHUB_OUTPUT"
          echo "latest_version=$latest" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$ndk_version" >> "$GITHUB_OUTPUT"
          echo "build_tags=$build_tags" >> "$GITHUB_OUTPUT"

      - name: 拉取 sing-box 上游源码
        if: steps.singbox_check.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.singbox_check.outputs.repo }}
          ref: ${{ steps.singbox_check.outputs.latest_version }}
          fetch-depth: 0
          persist-credentials: false
          path: .sing-box-source

      - name: 配置 sing-box Go 环境
        if: steps.singbox_check.outputs.changed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.singbox_check.outputs.go_version }}
          cache-dependency-path: .sing-box-source/go.sum

      - name: 配置 Android NDK
        if: steps.singbox_check.outputs.changed == 'true'
        id: setup_singbox_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.singbox_check.outputs.ndk_version }}

      - name: 更新 sing-box 内核
        if: steps.singbox_check.outputs.changed == 'true'
        id: singbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.singbox_check.outputs.build_tags }}
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
          CC: ${{ steps.setup_singbox_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          BPF_CLANG: ${{ steps.setup_singbox_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          SING_BOX_TARGET: ${{ steps.singbox_check.outputs.target }}
          CURRENT_VERSION: ${{ steps.singbox_check.outputs.current_version }}
          LATEST_VERSION: ${{ steps.singbox_check.outputs.latest_version }}
        shell: bash
        run: |
          set -euo pipefail

          old_size=0
          if [ -f "$SING_BOX_TARGET" ]; then
            old_size="$(stat -c '%s' "$SING_BOX_TARGET")"
          fi

          make -C .sing-box-source build
          test -s .sing-box-source/sing-box
          file .sing-box-source/sing-box | grep -q 'ARM aarch64'
          go version -m .sing-box-source/sing-box | grep -q "${LATEST_VERSION#v}"
          go version -m .sing-box-source/sing-box | grep -q 'with_ebpf'
          go version -m .sing-box-source/sing-box | grep -q 'with_tailscale'

          install -m 0755 .sing-box-source/sing-box "$SING_BOX_TARGET"
          tmpjson="$(mktemp)"
          jq --arg version "$LATEST_VERSION" \
            '.singBox.currentVersion = $version' \
            .github/resources.json > "$tmpjson"
          mv "$tmpjson" .github/resources.json
          new_size="$(stat -c '%s' "$SING_BOX_TARGET")"
          binary_sha256="$(sha256sum "$SING_BOX_TARGET" | cut -d ' ' -f 1)"
          release_json="$(gh api "repos/${{ steps.singbox_check.outputs.repo }}/releases/tags/${LATEST_VERSION}" 2>/dev/null || printf '{}')"
          release_url="$(jq -r '.html_url // empty' <<< "$release_json")"
          release_notes="$(jq -r '.body // empty' <<< "$release_json")"
          published_at="$(jq -r '.published_at // empty' <<< "$release_json")"
          compare_url="https://github.com/${{ steps.singbox_check.outputs.repo }}/compare/${CURRENT_VERSION}...${LATEST_VERSION}"
          build_tags="$(jq -c '.singBox.buildTags' .github/resources.json)"

          jq -n \
            --arg name "sing-box 内核" \
            --arg repo "${{ steps.singbox_check.outputs.repo }}" \
            --arg path "$SING_BOX_TARGET" \
            --arg currentVersion "$CURRENT_VERSION" \
            --arg latestVersion "$LATEST_VERSION" \
            --arg releaseUrl "$release_url" \
            --arg compareUrl "$compare_url" \
            --arg releaseNotes "$release_notes" \
            --arg publishedAt "$published_at" \
            --arg sha256 "$binary_sha256" \
            --argjson oldSize "$old_size" \
            --argjson newSize "$new_size" \
            --argjson buildTags "$build_tags" \
            '{
              name: $name,
              repo: $repo,
              path: $path,
              currentVersion: $currentVersion,
              latestVersion: $latestVersion,
              releaseUrl: $releaseUrl,
              compareUrl: $compareUrl,
              releaseNotes: $releaseNotes,
              publishedAt: $publishedAt,
              oldSize: $oldSize,
              newSize: $newSize,
              sha256: $sha256,
              buildTags: $buildTags,
              checks: ["ARM64 架构", "版本信息匹配", "包含 eBPF", "包含 Tailscale"]
            }' > "$UPDATE_REPORT_DIR/sing-box.json"

          echo "sing-box SHA-256: $binary_sha256"
          rm -rf .sing-box-source

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            src/webui/package-lock.json

      - name: 更新原始资源文件
        id: raw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          report='[]'

          count_rules() {
            repo="$1"
            commit="$2"
            metadata_path="$3"

            [ -n "$repo" ] && [ -n "$commit" ] && [ -n "$metadata_path" ] || return 0
            curl -fsSL --retry 2 --connect-timeout 10 \
              "https://raw.githubusercontent.com/${repo}/${commit}/${metadata_path}" 2>/dev/null |
              jq '[.rules[]? | to_entries[] | select(.value | type == "array") | (.value | length)] | add // 0' 2>/dev/null || true
          }

          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            item="$(base64 -d <<< "$encoded")"
            name="$(jq -r '.name' <<< "$item")"
            path="$(jq -r '.path' <<< "$item")"
            url="$(jq -r '.url' <<< "$item")"
            repo="$(jq -r '.repo' <<< "$item")"
            ref="$(jq -r '.ref' <<< "$item")"
            source_path="$(jq -r '.sourcePath' <<< "$item")"
            metadata_path="$(jq -r '.metadataPath // empty' <<< "$item")"
            current_commit="$(jq -r '.currentCommit // empty' <<< "$item")"

            echo "检查: $path ← $url"
            tmp="$(mktemp)"
            if ! curl -fsSL --retry 3 --connect-timeout 15 "$url" -o "$tmp"; then
              echo "::warning::下载失败，跳过: $url"
              rm -f "$tmp"
              continue
            fi
            if [ ! -s "$tmp" ]; then
              echo "::warning::内容为空，跳过: $url"
              rm -f "$tmp"
              continue
            fi

            if [ ! -f "$path" ] || ! cmp -s "$tmp" "$path"; then
              old_size=0
              old_sha256=""
              if [ -f "$path" ]; then
                old_size="$(stat -c '%s' "$path")"
                old_sha256="$(sha256sum "$path" | cut -d ' ' -f 1)"
              fi

              commit_json="$(gh api "repos/${repo}/commits?path=${source_path}&sha=${ref}&per_page=1" 2>/dev/null || printf '[]')"
              latest_commit="$(jq -r '.[0].sha // empty' <<< "$commit_json")"
              commit_message="$(jq -r '.[0].commit.message // empty' <<< "$commit_json")"
              commit_date="$(jq -r '.[0].commit.committer.date // empty' <<< "$commit_json")"
              commit_url="$(jq -r '.[0].html_url // empty' <<< "$commit_json")"

              mkdir -p "$(dirname "$path")"
              mv "$tmp" "$path"
              new_size="$(stat -c '%s' "$path")"
              new_sha256="$(sha256sum "$path" | cut -d ' ' -f 1)"
              old_rule_count="$(count_rules "$repo" "$current_commit" "$metadata_path")"
              new_rule_count="$(count_rules "$repo" "$latest_commit" "$metadata_path")"
              compare_url=""
              if [ -n "$current_commit" ] && [ -n "$latest_commit" ] && [ "$current_commit" != "$latest_commit" ]; then
                compare_url="https://github.com/${repo}/compare/${current_commit}...${latest_commit}"
              fi

              entry="$(jq -n \
                --arg name "$name" \
                --arg path "$path" \
                --arg repo "$repo" \
                --arg currentCommit "$current_commit" \
                --arg latestCommit "$latest_commit" \
                --arg commitMessage "$commit_message" \
                --arg commitDate "$commit_date" \
                --arg commitUrl "$commit_url" \
                --arg compareUrl "$compare_url" \
                --arg oldSha256 "$old_sha256" \
                --arg newSha256 "$new_sha256" \
                --arg oldRuleCount "$old_rule_count" \
                --arg newRuleCount "$new_rule_count" \
                --argjson oldSize "$old_size" \
                --argjson newSize "$new_size" \
                '{
                  name: $name,
                  path: $path,
                  repo: $repo,
                  currentCommit: $currentCommit,
                  latestCommit: $latestCommit,
                  commitMessage: $commitMessage,
                  commitDate: $commitDate,
                  commitUrl: $commitUrl,
                  compareUrl: $compareUrl,
                  oldSize: $oldSize,
                  newSize: $newSize,
                  oldSha256: $oldSha256,
                  newSha256: $newSha256,
                  oldRuleCount: (if $oldRuleCount == "" then null else ($oldRuleCount | tonumber) end),
                  newRuleCount: (if $newRuleCount == "" then null else ($newRuleCount | tonumber) end)
                }')"
              report="$(jq --argjson entry "$entry" '. + [$entry]' <<< "$report")"

              if [ -n "$latest_commit" ]; then
                tmpjson="$(mktemp)"
                jq --arg path "$path" --arg commit "$latest_commit" \
                  '(.raw[] | select(.path == $path).currentCommit) = $commit' \
                  .github/resources.json > "$tmpjson"
                mv "$tmpjson" .github/resources.json
              fi

              echo "  → 已更新"
            else
              rm -f "$tmp"
              echo "  → 无变化"
            fi
          done < <(jq -r '.raw[] | @base64' .github/resources.json)

          jq . <<< "$report" > "$UPDATE_REPORT_DIR/rules.json"

      - name: 更新 zashboard 仪表盘
        id: zashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$(jq -r '.githubRelease[0].repo' .github/resources.json)"
          dest="$(jq -r '.githubRelease[0].path' .github/resources.json)"
          pattern="$(jq -r '.githubRelease[0].assetPattern' .github/resources.json)"
          current="$(jq -r '.githubRelease[0].currentVersion' .github/resources.json)"

          release_json="$(gh release view --repo "$repo" --json tagName,name,publishedAt,url,body)"
          latest="$(jq -r '.tagName' <<< "$release_json")"
          echo "zashboard 当前: '${current:-无}'，最新: '$latest'"

          if [ "$latest" != "$current" ]; then
            echo "发现新版本，开始更新..."
            rm -rf tmp-zashboard && mkdir -p tmp-zashboard
            if gh release download "$latest" --repo "$repo" --pattern "$pattern" --dir tmp-zashboard; then
              asset="$(find tmp-zashboard -maxdepth 1 -type f | head -n 1)"
              asset_size="$(stat -c '%s' "$asset")"
              asset_sha256="$(sha256sum "$asset" | cut -d ' ' -f 1)"
              unzip -q tmp-zashboard/*.zip -d tmp-zashboard/extract
              # 若解压出单个顶层目录（dist/ 或 dist-no-fonts/ 等），进入它；否则用解压根
              srcdir="tmp-zashboard/extract"
              inner="$(find "$srcdir" -mindepth 1 -maxdepth 1)"
              if [ "$(printf '%s\n' "$inner" | grep -c .)" = "1" ] && [ -d "$inner" ]; then
                srcdir="$inner"
              fi
              rm -rf "$dest"
              mkdir -p "$dest"
              cp -r "$srcdir"/. "$dest"/
              # 回写当前版本到清单
              tmpjson="$(mktemp)"
              jq --arg v "$latest" '.githubRelease[0].currentVersion = $v' .github/resources.json > "$tmpjson"
              mv "$tmpjson" .github/resources.json

              jq -n \
                --arg name "zashboard" \
                --arg repo "$repo" \
                --arg path "$dest" \
                --arg currentVersion "$current" \
                --arg latestVersion "$latest" \
                --arg releaseName "$(jq -r '.name // empty' <<< "$release_json")" \
                --arg publishedAt "$(jq -r '.publishedAt // empty' <<< "$release_json")" \
                --arg releaseUrl "$(jq -r '.url // empty' <<< "$release_json")" \
                --arg releaseNotes "$(jq -r '.body // empty' <<< "$release_json")" \
                --arg assetPattern "$pattern" \
                --arg assetSha256 "$asset_sha256" \
                --argjson assetSize "$asset_size" \
                '{
                  name: $name,
                  repo: $repo,
                  path: $path,
                  currentVersion: $currentVersion,
                  latestVersion: $latestVersion,
                  releaseName: $releaseName,
                  publishedAt: $publishedAt,
                  releaseUrl: $releaseUrl,
                  releaseNotes: $releaseNotes,
                  assetPattern: $assetPattern,
                  assetSize: $assetSize,
                  assetSha256: $assetSha256
                }' > "$UPDATE_REPORT_DIR/zashboard.json"
            else
              echo "::warning::未找到资产 '$pattern'，跳过 zashboard 更新（请核对 assetPattern）"
            fi
            rm -rf tmp-zashboard
          else
            echo "已是最新，跳过"
          fi

      - name: 更新 sing-box Dashboard
        id: singbox_dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$(jq -r '.githubArchive[0].repo' .github/resources.json)"
          ref="$(jq -r '.githubArchive[0].ref' .github/resources.json)"
          dest="$(jq -r '.githubArchive[0].path' .github/resources.json)"
          current="$(jq -r '.githubArchive[0].currentCommit' .github/resources.json)"
          current_source="$(jq -r '.githubArchive[0].currentSourceCommit // empty' .github/resources.json)"
          latest_json="$(gh api "repos/${repo}/commits/${ref}")"
          latest="$(jq -r '.sha' <<< "$latest_json")"
          latest_source="$(jq -r '.commit.message' <<< "$latest_json" | sed -nE 's/^Deploy ([0-9a-f]{40}).*/\1/p')"

          echo "sing-box Dashboard 当前: '${current:-无}'，最新: '$latest'"

          if [ "$latest" != "$current" ]; then
            echo "发现上游更新，开始同步..."
            rm -rf tmp-sing-box-dashboard
            mkdir -p tmp-sing-box-dashboard/extract

            if curl -fsSL --retry 3 --connect-timeout 15 \
              "https://github.com/${repo}/archive/${latest}.zip" \
              -o tmp-sing-box-dashboard/dashboard.zip; then
              unzip -q tmp-sing-box-dashboard/dashboard.zip -d tmp-sing-box-dashboard/extract
              srcdir="$(find tmp-sing-box-dashboard/extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"

              if [ -n "$srcdir" ] && [ -f "$srcdir/index.html" ]; then
                rm -rf "$dest"
                mkdir -p "$dest"
                cp -r "$srcdir"/. "$dest"/

                tmpjson="$(mktemp)"
                jq --arg commit "$latest" --arg sourceCommit "$latest_source" \
                  '.githubArchive[0].currentCommit = $commit |
                   if $sourceCommit != ""
                   then .githubArchive[0].currentSourceCommit = $sourceCommit
                   else .
                   end' \
                  .github/resources.json > "$tmpjson"
                mv "$tmpjson" .github/resources.json

                compare_json='{}'
                if [ -n "$current_source" ] && [ -n "$latest_source" ] && [ "$current_source" != "$latest_source" ]; then
                  compare_json="$(gh api "repos/${repo}/compare/${current_source}...${latest_source}" 2>/dev/null || printf '{}')"
                fi

                commits="$(jq -c '[.commits[]? | {
                  sha: .sha,
                  message: .commit.message,
                  date: .commit.committer.date,
                  url: .html_url
                }]' <<< "$compare_json")"
                file_count="$(jq '[.files[]?] | length' <<< "$compare_json")"
                additions="$(jq '[.files[]?.additions] | add // 0' <<< "$compare_json")"
                deletions="$(jq '[.files[]?.deletions] | add // 0' <<< "$compare_json")"
                compare_url="$(jq -r '.html_url // empty' <<< "$compare_json")"

                jq -n \
                  --arg name "sing-box Dashboard" \
                  --arg repo "$repo" \
                  --arg path "$dest" \
                  --arg currentCommit "$current" \
                  --arg latestCommit "$latest" \
                  --arg currentSourceCommit "$current_source" \
                  --arg latestSourceCommit "$latest_source" \
                  --arg deployCommitUrl "$(jq -r '.html_url // empty' <<< "$latest_json")" \
                  --arg compareUrl "$compare_url" \
                  --argjson fileCount "$file_count" \
                  --argjson additions "$additions" \
                  --argjson deletions "$deletions" \
                  --argjson commits "$commits" \
                  '{
                    name: $name,
                    repo: $repo,
                    path: $path,
                    currentCommit: $currentCommit,
                    latestCommit: $latestCommit,
                    currentSourceCommit: $currentSourceCommit,
                    latestSourceCommit: $latestSourceCommit,
                    deployCommitUrl: $deployCommitUrl,
                    compareUrl: $compareUrl,
                    fileCount: $fileCount,
                    additions: $additions,
                    deletions: $deletions,
                    commits: $commits
                  }' > "$UPDATE_REPORT_DIR/sing-box-dashboard.json"
              else
                echo "::warning::归档中没有找到 Dashboard 入口文件，跳过更新"
              fi
            else
              echo "::warning::下载 sing-box Dashboard 失败，跳过更新"
            fi

            rm -rf tmp-sing-box-dashboard
          else
            echo "已是最新，跳过"
          fi

      - name: 更新 npm 依赖
        id: npm
        shell: bash
        run: |
          set -euo pipefail

          report='[]'

          update_npm_project() {
            project="$1"
            label="$2"
            before_package="$(mktemp)"
            before_lock="$(mktemp)"
            cp "$project/package.json" "$before_package"
            cp "$project/package-lock.json" "$before_lock"

            echo "更新 ${label}: ${project}"
            (
              cd "$project"
              npx --yes npm-check-updates@latest --upgrade --target minor
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            )

            if ! git diff --quiet -- "$project/package.json" "$project/package-lock.json"; then
              direct_changes="$(jq -n \
                --slurpfile before "$before_package" \
                --slurpfile after "$project/package.json" '
                  [
                    ("dependencies", "devDependencies") as $type |
                    (((($before[0][$type] // {}) + ($after[0][$type] // {})) | keys[])) as $name |
                    select(($before[0][$type][$name] // null) != ($after[0][$type][$name] // null)) |
                    {
                      name: $name,
                      from: ($before[0][$type][$name] // "未安装"),
                      to: ($after[0][$type][$name] // "已移除"),
                      type: $type
                    }
                  ]')"

              lock_changes="$(jq -n \
                --slurpfile before "$before_lock" \
                --slurpfile after "$project/package-lock.json" '
                  def versions($document):
                    reduce (($document.packages // {}) | to_entries[]) as $item ({};
                      if ($item.value.version // null) != null
                      then .[$item.key] = $item.value.version
                      else .
                      end
                    );
                  (versions($before[0])) as $old |
                  (versions($after[0])) as $new |
                  [
                    (($old + $new) | keys[]) as $key |
                    select(($old[$key] // null) != ($new[$key] // null)) |
                    {
                      path: $key,
                      from: ($old[$key] // "未安装"),
                      to: ($new[$key] // "已移除")
                    }
                  ]')"
              lock_change_count="$(jq 'length' <<< "$lock_changes")"
              lock_preview="$(jq '.[0:20]' <<< "$lock_changes")"
              project_report="$(jq -n \
                --arg path "$project" \
                --arg label "$label" \
                --argjson changes "$direct_changes" \
                --argjson lockfileChanges "$lock_preview" \
                --argjson lockfileChangeCount "$lock_change_count" \
                '{
                  path: $path,
                  label: $label,
                  changes: $changes,
                  lockfileChanges: $lockfileChanges,
                  lockfileChangeCount: $lockfileChangeCount
                }')"
              report="$(jq --argjson project "$project_report" '. + [$project]' <<< "$report")"
            fi

            rm -f "$before_package" "$before_lock"
          }

          update_npm_project "docs" "文档站"
          update_npm_project "src/webui" "WebUI"

          jq . <<< "$report" > "$UPDATE_REPORT_DIR/npm.json"

      - name: 更新 GitHub Actions
        id: actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          report='[]'
          specs="$(
            grep -RhoE \
              --include='*.yml' \
              --include='*.yaml' \
              'uses:[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@v[0-9]+' \
              .github | sed -E 's/^uses:[[:space:]]+//' | sort -u || true
          )"

          while IFS= read -r spec; do
            [ -n "$spec" ] || continue

            action="${spec%@*}"
            current="${spec##*@}"
            current_number="${current#v}"

            release_json="$(gh api "repos/${action}/releases/latest" 2>/dev/null || printf '{}')"
            latest="$(jq -r '.tag_name // empty' <<< "$release_json")"
            if [ -z "$latest" ]; then
              latest="$(gh api --paginate "repos/${action}/tags?per_page=100" --jq '.[].name' 2>/dev/null |
                grep -E '^v[0-9]+([.][0-9]+){0,2}$' |
                sort -V |
                tail -n 1 ||
                true)"
            fi
            latest_major="$(printf '%s\n' "$latest" | sed -nE 's/^(v[0-9]+).*/\1/p')"

            if [ -z "$latest_major" ]; then
              echo "::warning::无法确定 ${action} 的最新版本，跳过"
              continue
            fi

            latest_number="${latest_major#v}"
            if [ "$latest_number" -le "$current_number" ]; then
              continue
            fi

            echo "更新 ${action}: ${current} → ${latest_major}"
            escaped_action="${action//./\.}"
            grep -RlE \
              --include='*.yml' \
              --include='*.yaml' \
              "${escaped_action}@${current}([^0-9]|$)" \
              .github |
              xargs -r sed -i -E "s#${escaped_action}@${current}([^0-9]|$)#${action}@${latest_major}\1#g"

            release_url="$(jq -r '.html_url // empty' <<< "$release_json")"
            if [ -z "$release_url" ]; then
              release_url="https://github.com/${action}/releases/tag/${latest}"
            fi
            entry="$(jq -n \
              --arg name "$action" \
              --arg current "$current" \
              --arg latestMajor "$latest_major" \
              --arg latestRelease "$latest" \
              --arg releaseName "$(jq -r '.name // empty' <<< "$release_json")" \
              --arg publishedAt "$(jq -r '.published_at // empty' <<< "$release_json")" \
              --arg releaseUrl "$release_url" \
              --arg repositoryUrl "https://github.com/${action}" \
              '{
                name: $name,
                current: $current,
                latestMajor: $latestMajor,
                latestRelease: $latestRelease,
                releaseName: $releaseName,
                publishedAt: $publishedAt,
                releaseUrl: $releaseUrl,
                repositoryUrl: $repositoryUrl
              }')"
            report="$(jq --argjson entry "$entry" '. + [$entry]' <<< "$report")"
          done <<< "$specs"

          jq . <<< "$report" > "$UPDATE_REPORT_DIR/actions.json"

      - name: 验证 npm 项目
        run: |
          set -euo pipefail

          npm ci --prefix docs --no-audit --no-fund
          npm run build --prefix docs
          npm ci --prefix src/webui --no-audit --no-fund
          npm run build --prefix src/webui
          git diff --check
          node --check .github/scripts/render-update-report.mjs

          jq -n '[
            "文档站构建通过",
            "WebUI 构建通过",
            "Git 差异检查通过",
            "PR 更新报告脚本检查通过"
          ]' > "$UPDATE_REPORT_DIR/verification.json"

      - name: 生成 Pull Request 说明
        id: update_report
        shell: bash
        run: |
          set -euo pipefail

          body_path="$RUNNER_TEMP/update-resources-pr.md"
          node .github/scripts/render-update-report.mjs \
            --report-dir "$UPDATE_REPORT_DIR" \
            --body "$body_path" \
            --output "$GITHUB_OUTPUT"
          cat "$body_path" >> "$GITHUB_STEP_SUMMARY"

      - name: 开启 / 更新 Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-resources
          delete-branch: true
          base: main
          labels: resources
          title: ${{ steps.update_report.outputs.title }}
          commit-message: ${{ steps.update_report.outputs.title }}
          body-path: ${{ steps.update_report.outputs.body_path }}
