name: 构建模块与通知

on:
  workflow_dispatch:
  push:
    branches: [ main, custom ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # 仅在 push 或手动触发时构建，Release 发布时跳过
    if: github.event_name != 'release'
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 WebUI 依赖
        working-directory: webui
        run: npm install

      - name: 构建 WebUI
        working-directory: webui
        run: python build_webui.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NetProxy-Module
          path: NetProxy-Module/

  notify:
    runs-on: ubuntu-latest
    needs: build
    # 允许 notify 在 build 跳过时也能运行
    if: always()
    steps:
      - name: 构建成功通知
        if: ${{ needs.build.result == 'success' && github.event_name == 'push' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            🤖 *NetProxyBot 通知*
            ✅ 构建成功！
            
            📦 仓库: `${{ github.repository }}`
            🌿 分支: `${{ github.ref_name }}`
            🧾 Commit: `${{ github.sha }}`
            
            🔗 [查看 Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: 构建失败通知
        if: ${{ needs.build.result == 'failure' && github.event_name != 'release' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            🤖 *NetProxyBot 通知*
            ❌ 构建失败！
            
            📦 仓库: `${{ github.repository }}`
            🌿 分支: `${{ github.ref_name }}`
            🧾 Commit: `${{ github.sha }}`
            
            🔗 [查看 Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Release 发布通知
        if: ${{ github.event_name == 'release' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            🎉 *NetProxyBot 通知*
            🏷️ 新版本发布！
            
            🔖 版本: `${{ github.event.release.tag_name }}`
            📝 说明: `${{ github.event.release.name }}`
            
            ⬇️ 下载: [Release 页面](https://github.com/${{ github.repository }}/releases/latest)
