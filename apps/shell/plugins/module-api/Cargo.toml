[package]
name = "tauri-plugin-module-api"
version = "0.1.0"
authors = [ "NetProxy" ]
description = "Restricted Android read-only NetProxy bridge"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-module-api"

[dependencies]
tauri = { version = "=2.12.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
